server {
    listen 80;
    listen [::]:80;
    server_name studiob2b.mpsuper.ru interparts.studiob2b.mpsuper.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8448 ssl http2;
    server_name studiob2b.mpsuper.ru interparts.studiob2b.mpsuper.ru;

    ssl_certificate /etc/letsencrypt/live/studiob2b.mpsuper.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiob2b.mpsuper.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128M;

    location / {
        proxy_pass http://10.8.0.6:5184;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
